# ============================================================
#  Subnets  (5 total)
# ============================================================
Subnets:
  User:
    Hosts:
      - User0
      - User1
      - User2
      - User3
      - User4
      - User5
      - User6
    NACLs:
      all:
        in: all
        out: all
    Size: 8

  Enterprise:
    Hosts:
      - Enterprise0
      - Enterprise1
      - Enterprise2
      - Defender
    NACLs:
      all:
        in: all
        out: all
    Size: 5

  Operational:
    Hosts:
      - Op_Server0
      - Op_Host0
      - Op_Host1
      - Op_Host2
    NACLs:
      User:
        in: None
        out: all
      DMZ:
        in: None
        out: all
      all:
        in: all
        out: all
    Size: 5

  DMZ:
    Hosts:
      - DMZ_Server0
      - DMZ_Server1
    NACLs:
      Operational:
        in: None
        out: all
      Research:
        in: None
        out: all
      all:
        in: all
        out: all
    Size: 3

  Research:
    Hosts:
      - Research0
      - Research1
      - Research2
