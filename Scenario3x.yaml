# ============================================================
#  Hosts  (20 total: 18 active + Defender + gateway roles)
# ============================================================
Hosts:
  # --- Defender / monitoring ---
  Defender:
    AWS_Info: []
    image: Velociraptor_Server

  # --- Enterprise subnet (gateway + internal servers) ---
  Enterprise0:
    AWS_Info: []
    image: Gateway
    info:
      Enterprise0:
        Interfaces: All
    ConfidentialityValue: Medium
    AvailabilityValue: Medium

  Enterprise1:
    AWS_Info: []
    image: Internal
    info:
      Enterprise1:
        Interfaces: All
    ConfidentialityValue: Medium
    AvailabilityValue: Medium

  Enterprise2:
    AWS_Info: []
    image: Internal
    info:
      Enterprise2:
        Interfaces: All
      Op_Server0:
        Interfaces: IP Address
    ConfidentialityValue: Medium
    AvailabilityValue: Medium

  # --- Operational subnet ---
  Op_Host0:
